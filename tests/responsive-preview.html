<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contour · responsive preview</title>
<style>html{font:14px system-ui;background:#e9edf1;color:#354151}body{margin:0;padding:20px}header{display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:18px}select{padding:8px;border:1px solid #abb7c3;border-radius:7px;background:white}main{display:flex;justify-content:center}iframe{border:1px solid #8996a5;box-shadow:0 8px 40px #0003;background:#20262e;border-radius:12px;width:390px;height:780px;flex-shrink:0}small{display:block;text-align:center;padding:12px;color:#607080}</style>
<header><span>Contour · screen preview</span><select id="previewSize" aria-label="Preview size"><option value="360,740">360 × 740 · phone</option><option value="390,780" selected>390 × 780 · phone</option><option value="430,820">430 × 820 · phone</option><option value="740,360">740 × 360 · landscape</option><option value="768,900">768 × 900 · tablet</option><option value="1024,768">1024 × 768 · tablet</option><option value="1280,820">1280 × 820 · desktop</option></select></header>
<main><iframe id="editorPreview" src="../index.html" title="Contour editor"></iframe></main><small>Browser preview of screen dimensions. Physical pen pressure and iOS behavior require device testing.</small>
<script>document.getElementById('previewSize').onchange=e=>{const [w,h]=e.target.value.split(',');const f=document.getElementById('editorPreview');f.style.width=w+'px';f.style.height=h+'px';};</script></html>
